<!-- <!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Watchparty</title>
    <style>
      :root {
        --bg: #0e0f13;
        --panel: #171922;
        --line: #262a38;
        --text: #e8e9ee;
        --dim: #8b90a3;
        --accent: #7c5cff;
        --ok: #3ddc97;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          15px/1.45 system-ui,
          sans-serif;
      }
      button,
      input,
      textarea {
        font: inherit;
        color: var(--text);
      }
      input,
      textarea {
        background: #0e0f13;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        width: 100%;
      }
      button {
        background: var(--accent);
        border: 0;
        border-radius: 8px;
        padding: 9px 14px;
        cursor: pointer;
        font-weight: 600;
      }
      button.ghost {
        background: var(--panel);
        border: 1px solid var(--line);
      }
      button:hover {
        filter: brightness(1.1);
      }
      [hidden] {
        display: none !important;
      }
      #home {
        max-width: 820px;
        margin: 8vh auto;
        padding: 0 20px;
      }
      h1 {
        margin: 0 0 4px;
        font-size: 30px;
      }
      .sub {
        color: var(--dim);
        margin-bottom: 28px;
      }
      .cards {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      @media (max-width: 700px) {
        .cards {
          grid-template-columns: 1fr;
        }
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .card h2 {
        margin: 0;
        font-size: 17px;
      }
      label {
        font-size: 12px;
        color: var(--dim);
      }
      .err {
        color: #ff6b6b;
        min-height: 18px;
        font-size: 13px;
      }
      #room {
        display: grid;
        grid-template-columns: 1fr 340px;
        height: 100vh;
      }
      @media (max-width: 900px) {
        #room {
          grid-template-columns: 1fr;
          height: auto;
        }
      }
      #stage {
        padding: 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .bar {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
      }
      .pill {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 12px;
        font-size: 13px;
      }
      .pill b {
        letter-spacing: 2px;
      }
      #playerWrap {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 10px;
        overflow: hidden;
      }
      #playerWrap iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #ytwrap {
        position: absolute;
        inset: 0;
        background: #000;
      }
      .slot {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      .slot.top {
        z-index: 2;
      }
      .slot.hid {
        visibility: hidden;
      }
      .slot iframe {
        width: 100%;
        height: 100%;
      }
      #cover {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 72px;
        color: #fff;
        opacity: 0.9;
      }
      #probe {
        position: fixed;
        left: -9999px;
        top: 0;
        width: 320px;
        height: 180px;
      }
      #banner:empty {
        display: none;
      }
      #ytControls.viewer #ytSeek,
      #ytControls.viewer #ytTime,
      #ytControls.viewer #ytMute,
      #ytControls.viewer #ytVol,
      #ytControls.viewer #ytFs {
        display: none;
      }
      #ytControls.viewer {
        justify-content: center;
        background: none;
      }
      #ytShield {
        position: absolute;
        inset: 0 0 46px 0;
        z-index: 5;
        cursor: pointer;
      }
      #ytControls {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 6;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
        font-size: 13px;
      }
      #ytControls button {
        background: transparent;
        padding: 4px 8px;
        font-size: 16px;
      }
      #ytControls input[type="range"] {
        padding: 0;
        border: 0;
        background: transparent;
        accent-color: var(--accent);
        width: auto;
      }
      #ytSeek {
        flex: 1;
      }
      #ytVol {
        width: 80px !important;
      }
      @media (hover: hover) {
        #ytControls {
          opacity: 0;
          transition: opacity 0.2s;
        }
        #playerWrap:hover #ytControls {
          opacity: 1;
        }
      }
      #playerWrap:fullscreen {
        border-radius: 0;
      }
      #overlay {
        z-index: 10;
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 120px;
        font-weight: 800;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }
      #banner {
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--accent);
        border-radius: 8px;
        padding: 10px 14px;
        min-height: 42px;
      }
      #hostPanel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #hostPanel .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      #side {
        background: var(--panel);
        border-left: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        min-height: 0;
        height: 100vh;
      }
      @media (max-width: 900px) {
        #side {
          height: 420px;
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
      #people {
        padding: 12px;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
        color: var(--dim);
      }
      #people span {
        display: inline-block;
        margin: 2px 6px 2px 0;
        color: var(--text);
      }
      #chat {
        flex: 1;
        overflow: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg b {
        color: var(--accent);
      }
      .msg.host b {
        color: var(--ok);
      }
      .sys {
        color: var(--dim);
        font-size: 12px;
      }
      #chatForm {
        display: flex;
        gap: 8px;
        padding: 12px;
        border-top: 1px solid var(--line);
      }
      details {
        font-size: 12px;
        color: var(--dim);
      }
      pre {
        max-height: 140px;
        overflow: auto;
        background: #0e0f13;
        padding: 8px;
        border-radius: 6px;
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <div id="home">
      <h1>🍿 Watchparty</h1>
      <div class="sub">
        Create a room, share the code, watch together. The host runs the show.
      </div>
      <div class="cards">
        <div class="card">
          <h2>Host a room</h2>
          <label>Your name</label
          ><input id="hName" placeholder="Name" maxlength="24" />
          <label
            >YouTube video or playlist link, Vidrift movie/TV/anime embed, or
            another embed link / &lt;iframe&gt; code</label
          >
          <textarea
            id="hEmbed"
            rows="4"
            placeholder="https://embed.vidrift.net/embed/movie/698687"
          ></textarea>
          <button id="createBtn">Create room</button>
          <div class="err" id="hErr"></div>
        </div>
        <div class="card">
          <h2>Join a room</h2>
          <label>Your name</label
          ><input id="jName" placeholder="Name" maxlength="24" />
          <label>Room code</label
          ><input
            id="jCode"
            placeholder="ABCDE"
            maxlength="5"
            style="text-transform: uppercase"
          />
          <button id="joinBtn">Join</button>
          <div class="err" id="jErr"></div>
        </div>
      </div>
    </div>

    <div id="room" hidden>
      <div id="stage">
        <div class="bar">
          <span class="pill">Room <b id="codeLbl"></b></span>
          <button class="ghost" id="copyBtn">Copy invite link</button>
          <span class="pill" id="roleLbl"></span>
          <span class="pill" id="extLbl" hidden></span>
        </div>
        <div id="playerWrap">
          <iframe
            id="player"
            allowfullscreen
            allow="autoplay; fullscreen; picture-in-picture"
          ></iframe>
          <div id="ytwrap" hidden></div>
          <div id="cover" hidden>▶</div>
          <div id="ytShield" hidden></div>
          <div id="ytControls" hidden>
            <button id="ytPlay" title="Play / pause (everyone can)">▶</button>
            <span id="ytTime">0:00 / 0:00</span>
            <input
              type="range"
              id="ytSeek"
              min="0"
              max="0"
              step="1"
              value="0"
              title="Only the host can seek"
            />
            <button id="ytMute" title="Mute (just for you)">🔊</button>
            <input
              type="range"
              id="ytVol"
              min="0"
              max="100"
              value="100"
              title="Your volume"
            />
            <button id="ytFs" title="Fullscreen">⛶</button>
          </div>
          <div id="overlay" hidden></div>
        </div>
        <div id="probe"></div>
        <div id="banner">Waiting for the host…</div>
        <div id="hostPanel" hidden>
          <div class="row">
            <button id="cdBtn">⏱ 3-2-1 countdown</button>
            <button class="ghost" id="pauseBtn">⏸ Everyone pause</button>
            <button class="ghost" id="playBtn">▶ Everyone play</button>
            <button class="ghost" id="timeBtn">🕒 Time check</button>
          </div>
          <div class="row">
            <input
              id="newUrl"
              placeholder="Change video: paste new embed link / iframe code"
              style="flex: 1; min-width: 220px"
            />
            <button class="ghost" id="urlBtn">Load for everyone</button>
          </div>
          <div id="syncInfo" style="font-size: 12px; color: var(--dim)"></div>
          <details>
            <summary>Player message debug (what the embed sends us)</summary>
            <pre id="dbg">nothing yet</pre>
          </details>
        </div>
      </div>
      <div id="side">
        <div id="people"></div>
        <div id="chat"></div>
        <form id="chatForm">
          <input
            id="chatIn"
            placeholder="Say something…"
            maxlength="500"
            autocomplete="off"
          /><button>Send</button>
        </form>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let me = null,
        code = null,
        es = null,
        embedUrl = "",
        lastTime = null,
        lastTU = 0;

      const extractSrc = (s) => {
        const m = /src=["']([^"']+)["']/i.exec(s);
        return (m ? m[1] : s).trim();
      };
      const fmt = (t) => {
        t = Math.max(0, Math.floor(t));
        const h = Math.floor(t / 3600),
          m = Math.floor((t % 3600) / 60),
          s = t % 60;
        return (
          (h ? h + ":" + String(m).padStart(2, "0") : m) +
          ":" +
          String(s).padStart(2, "0")
        );
      };
      const parseTime = (s) => {
        const p = s.trim().split(":").map(Number);
        if (p.some(isNaN)) return null;
        return p.reduce((a, b) => a * 60 + b, 0);
      };
      const api = async (path, data) => {
        const r = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        return r.json();
      };

      // ---------- Home ----------
      if (location.protocol === "file:") {
        $("hErr").textContent = $("jErr").textContent =
          'You opened this as a file. Run "node server.js" and visit http://localhost:3000 instead.';
      }
      const params = new URLSearchParams(location.search);
      if (params.get("room"))
        $("jCode").value = params.get("room").toUpperCase();
      $("hName").value = $("jName").value =
        localStorage.getItem("hp_name") || "";

      $("createBtn").onclick = async () => {
        const name = $("hName").value.trim() || "Host";
        const url = extractSrc($("hEmbed").value);
        $("hErr").textContent = "";
        let r;
        try {
          r = await api("/api/rooms", { embedUrl: url });
        } catch {
          return ($("hErr").textContent =
            'Can\'t reach the server. Run "node server.js" and open http://localhost:3000 in your browser (not the file directly).');
        }
        if (r.error) return ($("hErr").textContent = r.error);
        localStorage.setItem("hp_name", name);
        sessionStorage.setItem("hp_token_" + r.code, r.hostToken);
        history.replaceState(null, "", "?room=" + r.code);
        enter(r.code, name);
      };
      $("joinBtn").onclick = async () => {
        const name = $("jName").value.trim() || "Guest";
        const c = $("jCode").value.trim().toUpperCase();
        if (!c) return ($("jErr").textContent = "Enter a room code");
        const chk = await fetch(`/api/rooms/${c}`)
          .then((r) => r.json())
          .catch(() => ({ error: "Server unreachable" }));
        if (chk.error) return ($("jErr").textContent = chk.error);
        localStorage.setItem("hp_name", name);
        history.replaceState(null, "", "?room=" + c);
        enter(c, name);
      };

      // ---------- Room ----------
      function enter(c, name) {
        code = c;
        $("home").hidden = true;
        $("room").hidden = false;
        $("codeLbl").textContent = c;
        const token = sessionStorage.getItem("hp_token_" + c) || "";
        es = new EventSource(
          `/api/rooms/${c}/events?name=${encodeURIComponent(name)}&token=${encodeURIComponent(token)}`,
        );
        es.addEventListener("hello", (e) => {
          const d = JSON.parse(e.data);
          me = { id: d.id, host: d.host };
          $("roleLbl").textContent = d.host
            ? "👑 You are the host"
            : "👀 Viewer";
          $("hostPanel").hidden = !d.host;
          $("ytSeek").disabled = !d.host;
          setPlayer(d.embedUrl, !!d.queue);
          if (d.queue) setQueue(d.queue.ids, d.queue.durs);
          if (d.yt) applyYT(d.yt);
          else if (d.player) showPlayer(d.player);
          else
            banner(
              d.host
                ? "You control the player below. Use the tools to keep everyone aligned."
                : "Waiting for the host to start…",
            );
          if (isYT(embedUrl) && !d.host) banner("");
        });
        es.addEventListener("roster", (e) => {
          $("people").innerHTML =
            "👥 " +
            JSON.parse(e.data)
              .map((p) => `<span>${p.host ? "👑 " : ""}${esc(p.name)}</span>`)
              .join("");
        });
        es.addEventListener("chat", (e) => {
          const m = JSON.parse(e.data);
          addMsg(m.name, m.text, m.host);
        });
        es.addEventListener("seturl", (e) => {
          setPlayer(JSON.parse(e.data).url);
          sys("Host loaded a new video.");
          banner("New video loaded. Wait for the host's countdown.");
        });
        es.addEventListener("countdown", (e) =>
          runCountdown(JSON.parse(e.data).n),
        );
        es.addEventListener("callout", (e) => {
          const d = JSON.parse(e.data);
          if (d.kind === "pause") banner("⏸ <b>Host says: PAUSE now</b>");
          if (d.kind === "play") banner("▶ <b>Host says: PLAY now</b>");
          if (d.kind === "time")
            banner(
              `🕒 <b>Host is at ${fmt(d.time)}</b> — seek your player to match.`,
            );
        });
        es.addEventListener("player", (e) => showPlayer(JSON.parse(e.data)));
        es.addEventListener("ytqueue", (e) => {
          const q = JSON.parse(e.data);
          setQueue(q.ids, q.durs);
        });
        es.addEventListener("ytstate", (e) => applyYT(JSON.parse(e.data)));
      }
      const esc = (s) =>
        s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      function banner(html) {
        $("banner").innerHTML = html;
      }
      function setPlayer(url, haveQueue) {
        if (url === embedUrl) return;
        embedUrl = url;
        pendingYT = null;
        lastSync = null;
        extReady = false;
        const pl = parsePL(url),
          v = pl ? null : parseYT(url);
        if (pl || v) {
          $("player").src = "about:blank";
          showYtUi();
          if (me.host && !haveQueue) resolveQueue(v, pl);
          else if (!me.host) banner("");
        } else {
          unmountYT();
          $("player").src = url;
        }
      }

      // ---------- YouTube mode: a video or whole playlist as ONE continuous movie ----------
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const isYT = (u) => !!(parsePL(u) || parseYT(u));
      function parsePL(u) {
        try {
          const l = new URL(u).searchParams.get("list");
          return l && /^[\w-]{10,}$/.test(l) ? l : null;
        } catch {
          return null;
        }
      }
      function parseYT(u) {
        try {
          const x = new URL(u),
            h = x.hostname.replace(/^www\.|^m\./, "");
          let id = null;
          if (h === "youtu.be") id = x.pathname.slice(1);
          else if (h === "youtube.com" || h === "youtube-nocookie.com") {
            id =
              x.searchParams.get("v") ||
              (/^\/(embed|shorts|live)\/([^/?]+)/.exec(x.pathname) || [])[2];
          }
          return id && /^[\w-]{11}$/.test(id) ? id : null;
        } catch {
          return null;
        }
      }
      function loadYTApi() {
        if (window.YT && YT.Player) return Promise.resolve();
        return new Promise((res) => {
          window.onYouTubeIframeAPIReady = res;
          const s = document.createElement("script");
          s.src = "https://www.youtube.com/iframe_api";
          document.head.append(s);
        });
      }
      // Q = the whole movie. Global time G = seconds from the start of the first video.
      let Q = { ids: [], durs: [], starts: [], total: 0 },
        S = [],
        slotsP = null,
        cur = 0,
        lock = null,
        vol = 100,
        muted = false;
      let want = false,
        grace = 0; // want = room should be playing; grace = ignore a not-playing player until then (loads/seeks take a moment)
      let pendingYT = null,
        hostTimer = null,
        lastSent = { playing: null, time: 0, at: 0 };
      const engineReady = () => S.length === 2 && Q.ids.length > 0;
      function makeSlot(n) {
        return new Promise((res) => {
          const s = {
            idx: -1,
            pre: false,
            preOk: false,
            el: document.createElement("div"),
          };
          s.el.className = "slot" + (n ? " hid" : " top");
          s.el.innerHTML = "<div></div>";
          $("ytwrap").append(s.el);
          s.p = new YT.Player(s.el.firstChild, {
            width: "100%",
            height: "100%",
            playerVars: {
              rel: 0,
              playsinline: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              iv_load_policy: 3,
              modestbranding: 1,
            },
            events: {
              onReady: () => res(s),
              onStateChange: (e) => onState(s, e.data),
              onError: (e) => {
                if (s === S[cur])
                  banner(
                    "⚠️ YouTube error " +
                      e.data +
                      (e.data === 101 || e.data === 150
                        ? " — embedding is disabled for this video."
                        : e.data === 153
                          ? " — open the site via http://localhost:3000 or an https address, not a file."
                          : ""),
                  );
              },
            },
          });
        });
      }
      function applyAudio(s) {
        s.p.setVolume(vol);
        muted ? s.p.mute() : s.p.unMute();
      }
      function onState(s, st) {
        if (s.pre && st === 1) {
          s.p.pauseVideo();
          s.p.seekTo(0, true);
          s.pre = false;
          s.preOk = true;
          return;
        } // preloaded & buffered
        if (s === S[cur] && st === 0 && s.idx + 1 < Q.ids.length)
          loadAt(s.idx + 1, 0, true); // fallback if swap missed
      }
      function loadAt(i, local, playing) {
        const a = S[cur];
        a.idx = i;
        a.pre = a.preOk = false;
        grace = Date.now() + 3000;
        lock = { G: Q.starts[i] + local, until: Date.now() + 1500 };
        const o = { videoId: Q.ids[i], startSeconds: local };
        playing ? a.p.loadVideoById(o) : a.p.cueVideoById(o);
        applyAudio(a);
      }
      function swap() {
        const o = S[cur];
        cur = 1 - cur;
        const n = S[cur];
        grace = Date.now() + 3000;
        n.el.classList.remove("hid");
        n.el.classList.add("top");
        applyAudio(n);
        o.el.classList.remove("top");
        o.p.pauseVideo();
        o.idx = -1;
        o.preOk = false;
        setTimeout(() => {
          if (S[cur] !== o) o.el.classList.add("hid");
        }, 250);
      }
      const isPlaying = () => {
        const s = S[cur].p.getPlayerState();
        return s === 1 || s === 3;
      };
      function setPlaying(pl) {
        if (pl && !want) grace = Date.now() + 3000;
        want = pl;
        if (S[cur].p.getPlayerState)
          pl ? S[cur].p.playVideo() : S[cur].p.pauseVideo();
      }
      function getG() {
        if (lock && Date.now() < lock.until) return lock.G;
        const a = S[cur];
        return a.idx < 0
          ? 0
          : Q.starts[a.idx] + (a.p.getCurrentTime ? a.p.getCurrentTime() : 0);
      }
      function locate(G) {
        let i = 0;
        while (i < Q.ids.length - 1 && G >= Q.starts[i + 1]) i++;
        return i;
      }
      function seekG(G, playing) {
        G = Math.min(Math.max(G, 0), Math.max(0, Q.total - 0.5));

        font-size: 13px;
        color: var(--dim);
      }
      #people span {
        display: inline-block;
        margin: 2px 6px 2px 0;
        color: var(--text);
      }
      #chat {
        flex: 1;
        overflow: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .msg b {
        color: var(--accent);
      }
      .msg.host b {
        color: var(--ok);
      }
      .sys {
        color: var(--dim);
        font-size: 12px;
      }
      #chatForm {
        display: flex;
        gap: 8px;
        padding: 12px;

        font-size: 12px;
        color: var(--dim);
      }
      pre {
        max-height: 140px;
        overflow: auto;
        background: #0e0f13;
        padding: 8px;
        border-radius: 6px;
        margin: 6px 0 0;
      }
    </style>
  </head>
  <body>
    <div id="home">
      <h1>🍿 Watchparty</h1>
      <div class="sub">
        Create a room, share the code, watch together. The host runs the show.
      </div>
      <div class="cards">
        <div class="card">
          <h2>Host a room</h2>
          <label>Your name</label
          ><input id="hName" placeholder="Name" maxlength="24" />
          <label>
            YouTube link / playlist, embed link, or Vidrift TMDB Movie ID
          </label>
          <textarea
            id="hEmbed"
            rows="2"
            placeholder="Enter TMDB ID (e.g. 698687) or paste a YouTube link"
          ></textarea>
          <button id="createBtn">Create room</button>
          <div class="err" id="hErr"></div>
        </div>
        <div class="card">
          <h2>Join a room</h2>
          <label>Your name</label
          ><input id="jName" placeholder="Name" maxlength="24" />
          <label>Room code</label
          ><input
            id="jCode"
            placeholder="ABCDE"
            maxlength="5"
            style="text-transform: uppercase"
          />
          <button id="joinBtn">Join</button>
          <div class="err" id="jErr"></div>
        </div>
      </div>
    </div>

    <div id="room" hidden>
      <div id="stage">
        <div class="bar">
          <span class="pill">Room <b id="codeLbl"></b></span>
          <button class="ghost" id="copyBtn">Copy invite link</button>
          <span class="pill" id="roleLbl"></span>
          <span class="pill" id="extLbl" hidden></span>
        </div>
        <div id="playerWrap">
          <iframe
            id="player"
            allowfullscreen
            allow="autoplay; fullscreen"
          ></iframe>
          <div id="ytwrap" hidden></div>
          <div id="cover" hidden>▶</div>
          <div id="ytShield" hidden></div>
          <div id="ytControls" hidden>
            <button id="ytPlay" title="Play / pause (everyone can)">▶</button>
            <span id="ytTime">0:00 / 0:00</span>
            <input
              type="range"
              id="ytSeek"
              min="0"
              max="0"
              step="1"
              value="0"
              title="Only the host can seek"
            />
            <button id="ytCC" class="off" title="Captions (just for you)">
              CC
            </button>
            <button id="ytMute" title="Mute (just for you)">🔊</button>
            <input
              type="range"
              id="ytVol"
              min="0"
              max="100"
              value="100"
              title="Your volume"
            />
            <button id="ytFs" title="Fullscreen">⛶</button>
          </div>
          <div id="overlay" hidden></div>
        </div>
        <div id="probe"></div>
        <div id="banner">Waiting for the host…</div>
        <div id="hostPanel" hidden>
          <div class="row">
            <button id="cdBtn">⏱ 3-2-1 countdown</button>
            <button class="ghost" id="pauseBtn">⏸ Everyone pause</button>
            <button class="ghost" id="playBtn">▶ Everyone play</button>
            <button class="ghost" id="timeBtn">🕒 Time check</button>
          </div>
          <div class="row">
            <input
              id="newUrl"
              placeholder="Change video: Enter TMDB ID or paste a new video link"
              style="flex: 1; min-width: 220px"
            />
            <button class="ghost" id="urlBtn">Load for everyone</button>
          </div>
          <div id="syncInfo" style="font-size: 12px; color: var(--dim)"></div>
          <details>
            <summary>Player message debug (what the embed sends us)</summary>
            <pre id="dbg">nothing yet</pre>
          </details>
        </div>
      </div>
      <div id="side">
        <div id="people"></div>
        <div id="chat"></div>
        <form id="chatForm">
          <input
            id="chatIn"
            placeholder="Say something…"
            maxlength="500"
            autocomplete="off"
          /><button>Send</button>
        </form>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      let me = null,
        code = null,
        es = null,
        embedUrl = "",
        lastTime = null,
        lastTU = 0;

      // Vidrift's documented cross-origin postMessage API.
      let vidriftMode = false,
        vidriftJoined = false,
        vidriftState = null,
        vidriftLocal = null,
        vidriftLastPublish = 0,
        vidriftChaseAt = 0,
        vidriftSeeking = false;
      let vidriftSubtitleOptions = [];
      let vidriftSubtitleValue = "off";
      let vidriftLastSubtitle = null;
      const VIDRIFT_ORIGIN = "https://embed.vidrift.net";
      const isVidrift = (u) => {
        try {
          const x = new URL(u);
          return (
            x.origin === VIDRIFT_ORIGIN &&
            ["/embed/movie/", "/embed/tv/", "/embed/anilist/"].some((p) =>
              x.pathname.startsWith(p),
            )
          );
        } catch {
          return false;
        }
      };
      function vidriftUrl(u, isHost = false) {
        const x = new URL(u);
        const hidden = new Set(
          (x.searchParams.get("hide") || "").split(",").filter(Boolean),
        );
        const playerControls = [
          "progress",
          "volume",
          "skip",
          "time",
          "subtitles",
          "settings",
        ];

        if (isHost) {
          // The host uses Vidrift's own iframe controls; do not hide them.
          playerControls.forEach((v) => hidden.delete(v));
        } else {
          // Viewers keep the compact Watchparty controls.
          [
            ...playerControls,
            "title",
            "server",
            "next",
            "episodes",
            "pausecard",
          ].forEach((v) => hidden.add(v));
        }

        if (hidden.size) x.searchParams.set("hide", [...hidden].join(","));
        else x.searchParams.delete("hide");
        return x.href;
      }

      const extractSrc = (s) => {
        const m = /src=["']([^"']+)["']/i.exec(s);
        return (m ? m[1] : s).trim();
      };
      function resolveVideoInput(input) {
        const value = extractSrc(input).trim();

        // If only a TMDB ID is entered, generate Vidrift movie URL
        if (/^\d+$/.test(value)) {
          return `https://embed.vidrift.net/embed/movie/${value}`;
        }

        // Otherwise preserve existing YouTube and embed URL support
        return value;
      }
      const fmt = (t) => {
        t = Math.max(0, Math.floor(t));
        const h = Math.floor(t / 3600),
          m = Math.floor((t % 3600) / 60),
          s = t % 60;
        return (
          (h ? h + ":" + String(m).padStart(2, "0") : m) +
          ":" +
          String(s).padStart(2, "0")
        );
      };
      const parseTime = (s) => {
        const p = s.trim().split(":").map(Number);
        if (p.some(isNaN)) return null;
        return p.reduce((a, b) => a * 60 + b, 0);
      };
      const api = async (path, data) => {
        const r = await fetch(path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        return r.json();
      };

      // ---------- Home ----------
      if (location.protocol === "file:") {
        $("hErr").textContent = $("jErr").textContent =
          'You opened this as a file. Run "node server.js" and visit http://localhost:3000 instead.';
      }
      const params = new URLSearchParams(location.search);
      if (params.get("room"))
        $("jCode").value = params.get("room").toUpperCase();
      $("hName").value = $("jName").value =
        localStorage.getItem("hp_name") || "";

      $("createBtn").onclick = async () => {
        const name = $("hName").value.trim() || "Host";
        const url = resolveVideoInput($("hEmbed").value);
        $("hErr").textContent = "";
        let r;
        try {
          r = await api("/api/rooms", { embedUrl: url });
        } catch {
          return ($("hErr").textContent =
            'Can\'t reach the server. Run "node server.js" and open http://localhost:3000 in your browser (not the file directly).');
        }
        if (r.error) return ($("hErr").textContent = r.error);
        localStorage.setItem("hp_name", name);
        sessionStorage.setItem("hp_token_" + r.code, r.hostToken);
        history.replaceState(null, "", "?room=" + r.code);
        enter(r.code, name);
      };
      $("joinBtn").onclick = async () => {
        const name = $("jName").value.trim() || "Guest";
        const c = $("jCode").value.trim().toUpperCase();
        if (!c) return ($("jErr").textContent = "Enter a room code");
        const chk = await fetch(`/api/rooms/${c}`)
          .then((r) => r.json())
          .catch(() => ({ error: "Server unreachable" }));
        if (chk.error) return ($("jErr").textContent = chk.error);
        localStorage.setItem("hp_name", name);
        history.replaceState(null, "", "?room=" + c);
        enter(c, name);
      };

      // ---------- Room ----------
      function enter(c, name) {
        code = c;
        $("home").hidden = true;
        $("room").hidden = false;
        $("codeLbl").textContent = c;
        const token = sessionStorage.getItem("hp_token_" + c) || "";
        es = new EventSource(
          `/api/rooms/${c}/events?name=${encodeURIComponent(name)}&token=${encodeURIComponent(token)}`,
        );
        es.addEventListener("hello", (e) => {
          const d = JSON.parse(e.data);
          me = { id: d.id, host: d.host };
          $("roleLbl").textContent = d.host
            ? "👑 You are the host"
            : "👀 Viewer";
          $("hostPanel").hidden = !d.host;
          $("ytSeek").disabled = !d.host;
          setPlayer(d.embedUrl, !!d.queue);
          if (d.queue) setQueue(d.queue.ids, d.queue.durs);
          if (d.yt) applyYT(d.yt);
          if (d.vidrift) applyVidriftRoomState(d.vidrift);
          else if (d.player) showPlayer(d.player);
          else
            banner(
              d.host
                ? "You control the player below. Use the tools to keep everyone aligned."
                : "Waiting for the host to start…",
            );
          if (isYT(embedUrl) && !d.host) banner("");
        });
        es.addEventListener("roster", (e) => {
          $("people").innerHTML =
            "👥 " +
            JSON.parse(e.data)
              .map((p) => `<span>${p.host ? "👑 " : ""}${esc(p.name)}</span>`)
              .join("");
        });
        es.addEventListener("chat", (e) => {
          const m = JSON.parse(e.data);
          addMsg(m.name, m.text, m.host);
        });
        es.addEventListener("seturl", (e) => {
          setPlayer(JSON.parse(e.data).url);
          sys("Host loaded a new video.");
          banner("New video loaded. Wait for the host's countdown.");
        });
        es.addEventListener("countdown", (e) =>
          runCountdown(JSON.parse(e.data).n),
        );
        es.addEventListener("callout", (e) => {
          const d = JSON.parse(e.data);
          if (d.kind === "pause") banner("⏸ <b>Host says: PAUSE now</b>");
          if (d.kind === "play") banner("▶ <b>Host says: PLAY now</b>");
          if (d.kind === "time")
            banner(
              `🕒 <b>Host is at ${fmt(d.time)}</b> — seek your player to match.`,
            );
        });
        es.addEventListener("player", (e) => showPlayer(JSON.parse(e.data)));
        es.addEventListener("ytqueue", (e) => {
          const q = JSON.parse(e.data);
          setQueue(q.ids, q.durs);
        });
        es.addEventListener("ytstate", (e) => applyYT(JSON.parse(e.data)));
        es.addEventListener("vstate", (e) => {
          const st = JSON.parse(e.data);
          const isOwnHostUpdate =
            me && me.host && st.by === me.id && st.kind !== "toggle";
          applyVidriftRoomState(st, !isOwnHostUpdate);
        });
      }
      const esc = (s) =>
        s.replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      function banner(html) {
        $("banner").innerHTML = html;
      }
      function setPlayer(url, haveQueue) {
        if (url === embedUrl) return;
        embedUrl = url;
        pendingYT = null;
        lastSync = null;
        extReady = false;
        vidriftMode = isVidrift(url);
        vidriftJoined = false;
        vidriftState = null;
        vidriftLocal = null;
        $("playerWrap").classList.toggle("vidrift", vidriftMode);
        const pl = parsePL(url),
          v = pl ? null : parseYT(url);
        if (pl || v) {
          unmountVidriftUi();
          $("player").src = "about:blank";
          showYtUi();
          if (me.host && !haveQueue) resolveQueue(v, pl);
          else if (!me.host) banner("");
        } else {
          unmountYT();
          $("player").hidden = false;
          $("ytwrap").hidden = true;
          $("ytShield").hidden = true;
          $("ytControls").hidden = true;
          $("cover").hidden = true;
          if (vidriftMode) {
            $("player").src = vidriftUrl(url, !!me.host);
            $("extLbl").hidden = false;
            $("extLbl").textContent =
              "🎬 Vidrift sync: click once inside the player";
            banner("Click once inside the video to enable synced controls.");
          } else {
            $("player").src = url;
          }
        }
        setExtPill();
      }

      function unmountVidriftUi() {
        vidriftMode = false;
        vidriftJoined = false;
        vidriftState = null;
        vidriftLocal = null;
        $("playerWrap").classList.remove("vidrift");
        $("ytShield").hidden = true;
        $("ytControls").hidden = true;
        $("extLbl").hidden = true;
      }
      function sendVidrift(message) {
        const w = $("player").contentWindow;
        if (w && vidriftMode) w.postMessage(message, VIDRIFT_ORIGIN);
      }
      function vidriftTime() {
        if (!vidriftState) return 0;
        return Math.max(
          0,
          vidriftState.time +
            (vidriftState.playing ? (Date.now() - vidriftState.at) / 1000 : 0),
        );
      }

      function applyVidriftRoomState(st, applyToPlayer = true) {
        if (!vidriftMode || !st) return;

        vidriftState = {
          playing: !!st.playing,
          time: Math.max(0, +st.time || 0),
          duration:
            +st.duration || (vidriftState && vidriftState.duration) || 0,
          at: Date.now(),
        };

        if (!vidriftJoined || !applyToPlayer) return;

        const kind = st.kind || "join";
        const target = vidriftTime();

        // Progress updates only update the room clock.
        // Never seek the actual video on every heartbeat.
        if (kind === "progress" || kind === "state") return;

        // Seek only when joining, receiving an initial state,
        // or when the host explicitly changes the timestamp.
        if (["join", "initial", "seek"].includes(kind)) {
          sendVidrift({
            type: "vidrift:resume",
            currentTime: target,
          });
        }

        // Apply actual playback state.
        sendVidrift({
          type: vidriftState.playing ? "vidrift:play" : "vidrift:pause",
        });
      }

      function joinVidriftControls() {
        if (!vidriftMode || vidriftJoined) return;
        vidriftJoined = true;
        // Hosts use the embed's native controls; viewers keep Watchparty's
        // compact play/pause, captions, and fullscreen controls.
        $("ytControls").hidden = !!me.host;
        $("ytControls").classList.toggle("viewer", !me.host);
        $("ytSeek").disabled = !me.host;
        $("ytShield").hidden = !!me.host;
        $("extLbl").textContent = "🎬 Vidrift sync: connected";
        banner("Synced controls enabled.");
        const roomClock = !me.host &&
          vidriftState && {
            playing: vidriftState.playing,
            time: vidriftTime(),
            duration: vidriftState.duration,
            kind: "join",
          };
        sendVidrift({ type: "vidrift:get-state" });
        if (roomClock) applyVidriftRoomState(roomClock);
      }
      function publishVidriftState(playing, time, duration, kind) {
        if (!me || !me.host || !vidriftMode) return;
        const now = Date.now();
        vidriftState = {
          ...(vidriftState || {}),
          playing,
          time,
          duration: duration || 0,
          at: now,
        };
        vidriftLocal = { playing, time, duration: duration || 0, at: now };
        vidriftLastPublish = now;
        act("vstate", { playing, time, duration: duration || 0, kind });
      }
      function toggleVidrift() {
        if (!vidriftMode) return;
        if (!vidriftJoined) {
          banner(
            "Click once inside the video first; browser security requires it.",
          );
          return;
        }
        const playing = !(vidriftState && vidriftState.playing);
        act("vplay", {
          playing,
          time: vidriftTime(),
          duration: vidriftState?.duration || 0,
        });
      }
      function updateVidriftCC() {
        const btn = $("ytCC");

        const available = vidriftSubtitleOptions.some((s) => s.value !== "off");

        btn.disabled = !available;
        btn.classList.toggle("off", vidriftSubtitleValue === "off");

        btn.title = !available
          ? "No subtitles available"
          : vidriftSubtitleValue === "off"
            ? "Turn subtitles on"
            : "Turn subtitles off";
      }

      function toggleVidriftCC() {
        if (!vidriftMode || !vidriftJoined) return;

        const available = vidriftSubtitleOptions.filter(
          (s) => s.value !== "off",
        );

        if (!available.length) {
          banner("No subtitles available for this video.");
          return;
        }

        let next;

        if (vidriftSubtitleValue !== "off") {
          vidriftLastSubtitle = vidriftSubtitleValue;
          next = "off";
        } else {
          const previous = available.find(
            (s) => s.value === vidriftLastSubtitle,
          );

          next = previous ? previous.value : available[0].value;
        }

        sendVidrift({
          type: "vidrift:set",
          subtitle: next,
        });
      }

      // ---------- YouTube mode: a video or whole playlist as ONE continuous movie ----------
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const isYT = (u) => !!(parsePL(u) || parseYT(u));
      function parsePL(u) {
        try {
          const l = new URL(u).searchParams.get("list");
          return l && /^[\w-]{10,}$/.test(l) ? l : null;
        } catch {
          return null;
        }
      }
      function parseYT(u) {
        try {
          const x = new URL(u),
            h = x.hostname.replace(/^www\.|^m\./, "");
          let id = null;
          if (h === "youtu.be") id = x.pathname.slice(1);
          else if (h === "youtube.com" || h === "youtube-nocookie.com") {
            id =
              x.searchParams.get("v") ||
              (/^\/(embed|shorts|live)\/([^/?]+)/.exec(x.pathname) || [])[2];
          }
          return id && /^[\w-]{11}$/.test(id) ? id : null;
        } catch {
          return null;
        }
      }
      function loadYTApi() {
        if (window.YT && YT.Player) return Promise.resolve();
        return new Promise((res) => {
          window.onYouTubeIframeAPIReady = res;
          const s = document.createElement("script");
          s.src = "https://www.youtube.com/iframe_api";
          document.head.append(s);
        });
      }
      // Q = the whole movie. Global time G = seconds from the start of the first video.
      let Q = { ids: [], durs: [], starts: [], total: 0 },
        S = [],
        slotsP = null,
        cur = 0,
        lock = null,
        vol = 100,
        muted = false;
      let want = false,
        grace = 0; // want = room should be playing; grace = ignore a not-playing player until then (loads/seeks take a moment)
      const GRACE_MS = 8000; // how long we wait for a load/seek/autoplay before even nagging
      const DRIFT_S = 1.5; // how far behind/ahead of the room we tolerate before jumping back in sync
      // rc = the room clock {playing,time,at}. Everyone (host included) chases it, so one person's
      // buffering never changes it. Only an explicit play/pause/seek by a user does.
      let rc = null,
        chaseAt = 0,
        retryAt = 0;
      const rcTime = () =>
        rc ? rc.time + (rc.playing ? (Date.now() - rc.at) / 1000 : 0) : 0;
      let pendingYT = null,
        hostTimer = null,
        lastSent = { playing: null, time: 0, at: 0 };
      const engineReady = () => S.length === 2 && Q.ids.length > 0;
      function makeSlot(n) {
        return new Promise((res) => {
          const s = {
            idx: -1,
            pre: false,
            preOk: false,
            el: document.createElement("div"),
          };
          s.el.className = "slot" + (n ? " hid" : " top");
          s.el.innerHTML = "<div></div>";
          $("ytwrap").append(s.el);
          s.p = new YT.Player(s.el.firstChild, {
            width: "100%",
            height: "100%",
            playerVars: {
              rel: 0,
              playsinline: 1,
              controls: 0,
              disablekb: 1,
              fs: 0,
              iv_load_policy: 3,
              modestbranding: 1,
              cc_load_policy: 0,
            },
            events: {
              onReady: () => res(s),
              onStateChange: (e) => onState(s, e.data),
              onError: (e) => {
                if (s === S[cur])
                  banner(
                    "⚠️ YouTube error " +
                      e.data +
                      (e.data === 101 || e.data === 150
                        ? " — embedding is disabled for this video."
                        : e.data === 153
                          ? " — open the site via http://localhost:3000 or an https address, not a file."
                          : ""),
                  );
              },
            },
          });
        });
      }
      function applyAudio(s) {
        s.p.setVolume(vol);
        muted ? s.p.mute() : s.p.unMute();
      }
      let ccOn = false; // captions: personal, never synced
      function applyCC(s) {
        try {
          if (!ccOn) {
            s.p.unloadModule("captions");
            return;
          }
          s.p.loadModule("captions");
          setTimeout(() => {
            const tl = s.p.getOption("captions", "tracklist") || [];
            const t = tl.find((x) => /^en/.test(x.languageCode)) || tl[0];
            if (t)
              s.p.setOption("captions", "track", {
                languageCode: t.languageCode,
              });
          }, 400);
        } catch {}
      }
      $("ytCC").onclick = () => {
        if (vidriftMode) {
          toggleVidriftCC();
          return;
        }

        ccOn = !ccOn;
        $("ytCC").classList.toggle("off", !ccOn);

        if (engineReady()) applyCC(S[cur]);
      };
      function onState(s, st) {
        if (st === 1) applyCC(s);
        if (s.pre && st === 1) {
          s.p.pauseVideo();
          s.p.seekTo(0, true);
          s.pre = false;
          s.preOk = true;
          return;
        } // preloaded & buffered
        if (s === S[cur] && st === 0 && s.idx + 1 < Q.ids.length)
          loadAt(s.idx + 1, 0, true); // fallback if swap missed
      }
      function loadAt(i, local, playing) {
        const a = S[cur];
        a.idx = i;

          m.event ?? m.type ?? m.data?.event ?? "",
        ).toLowerCase();
        const time =
          m.currentTime ?? m.time ?? m.data?.currentTime ?? m.data?.time;
        if (typeof time !== "number") return null;
        if (ev.includes("seek")) return { event: "seeked", time };
        if (ev.includes("pause")) return { event: "pause", time };
        if (ev.includes("play")) return { event: "play", time };
        if (ev.includes("time") || ev.includes("progress"))
          return { event: "timeupdate", time };
        return null;
      }
    </script>
  </body>
</html>
